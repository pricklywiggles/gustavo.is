  - slot: domain/DNS/TLS management
    choice: Vercel DNS (already in place) + Resend sending records
    version: n/a (platform)
    install:
      - 'Verify gustavo.is nameservers remain ns1/ns2.vercel-dns.com'
      - 'Add the Resend-generated SPF (TXT), DKIM (TXT), and MX records for the sending subdomain'
      - 'Add DMARC:  _dmarc.gustavo.is TXT "v=DMARC1; p=none; rua=mailto:<your-address>;"'
      - 'Confirm registrar auto-renew is on, with a payment method that will not expire'
      - 'Enable phishing-resistant MFA on the registrar and Vercel accounts'
    caveats:
      - 'DOMAIN EXPIRY IS THE SINGLE MOST LIKELY WAY THIS SITE DIES, and it appears on no stack list. Auto-renew plus a live payment method plus registrar lock matter more than anything else in this file.'
      - 'TLS is automatic on Vercel. Certificates are now capped at 200 days (CA/B Forum SC-081v3), dropping to 100 in March 2027 and 47 in March 2029 — automation is structural, not a convenience.'
      - 'Start DMARC at p=none for monitoring. Only advance to quarantine/reject once SPF and DKIM are confirmed passing. DMARC is now Standards Track (RFC 9989, May 2026).'
      - 'Send from a subdomain (send.gustavo.is), not the apex, to isolate sending reputation.'
      - 'Apex CNAME is forbidden by RFC 1034; ALIAS/flattening is proprietary per-provider and is a real migration cost if you ever leave Vercel.'
      - 'Certificate Transparency makes every hostname public — any preview/staging subdomain is world-readable once it gets a cert.'
      - 'If a subdomain is ever decommissioned, retire the DNS record BEFORE the resource, or you leave a dangling record open to subdomain takeover.'
    notes: 'https://www.ncsc.gov.uk/guidance/managing-public-domain-names | https://resend.com/docs/dashboard/domains/dmarc'

  - slot: content backup/durability
    choice: git mirror to a second host, independent of the primary
    version: n/a (procedure)
    install:
      - 'Create an empty repo on a second provider (e.g. Codeberg, GitLab, or a self-hosted remote on the same VPS as Plausible)'
      - 'git clone --mirror <primary-url> gustavo-is-mirror.git'
      - 'cd gustavo-is-mirror.git && git push --mirror <secondary-url>'
      - 'Refresh periodically:  git fetch -p origin && git push --mirror <secondary-url>'
    caveats:
      - 'The writing is the only irreplaceable asset in this project. Everything else is reinstallable from this YAML.'
      - 'A single git remote is one copy in one account — and that account is the one most likely to be compromised or locked out. CISA 3-2-1: three copies, two media, one offsite.'
      - 'The VPS already exists for Plausible, so it is a natural second remote and costs nothing extra.'
      - 'Also back up the Plausible databases (see the analytics slot) — that data is NOT in git.'
    notes: 'CISA 3-2-1 backup guidance'

