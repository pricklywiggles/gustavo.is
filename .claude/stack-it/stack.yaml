  - slot: security response headers
    choice: Next.js headers() in next.config.mjs. CSP script-src allows 'unsafe-inline'; everything else strict.
    version: n/a (configuration)
    install:
      - 'In next.config.mjs (not .ts, fumadocs-mdx requires the ESM config file), add an async headers() returning: Content-Security-Policy, Strict-Transport-Security (max-age=63072000; includeSubDomains; production only, since Safari caches HSTS from http://localhost and then force-upgrades dev), X-Content-Type-Options: nosniff, Referrer-Policy: strict-origin-when-cross-origin, X-Frame-Options: DENY, Permissions-Policy: camera=(), microphone=(), geolocation=()'
      - 'CSP as shipped: default-src ''self''; script-src ''self'' ''unsafe-inline'' (plus ''unsafe-eval'' in development only); style-src ''self'' ''unsafe-inline''; img-src ''self'' data:; font-src ''self''; frame-src https://player.vimeo.com (the retrospective walkthrough embeds only); object-src ''none''; base-uri ''self''; form-action ''self''; frame-ancestors ''none''; upgrade-insecure-requests (production only: Safari applies it to localhost subresources, WebKit bug 250776)'
      - 'Also set poweredByHeader: false in nextConfig — Next emits X-Powered-By: Next.js by default, unnecessary information disclosure per OWASP guidance.'
      - 'VERIFY LIVE, not just that the build succeeds: `pnpm run build && pnpm run start -p <port>`, then curl/httpie the actual response headers. Config that parses is not proof the headers are emitted — confirmed this in practice, including re-verifying after adding poweredByHeader to confirm X-Powered-By was actually gone from the response.'
      - 'VERIFY HYDRATION LIVE IN A REAL BROWSER, not just that headers are present. A syntactically valid, header-present CSP can still silently break the entire app — see the scaffold-and-verify finding below. Check for real React hydration (e.g. inspect a DOM node for a __reactProps$/__reactFiber$ key) after any CSP change, not just that the page renders.'
    caveats:
      - 'CORRECTED DURING scaffold-and-verify (stage 4), replacing this slot''s original decide-stage plan: the original CSP shipped with script-src ''self'' and NO unsafe-inline, believing (per stage-1/stage-2 research) that this was compatible with a hash-based or SRI-based approach for a static site. It was not. Confirmed empirically: this CSP silently blocked React from EVER hydrating any page on the site. Zero DOM elements carried React fiber attachments; every interactive feature was dead (forms fell back to native browser submission, animations never ran) while the page still LOOKED correct, because the static server-rendered HTML painted fine — this is a genuinely dangerous failure mode because nothing about it looks broken at a glance or shows up as a build/lint/type error.'
      - 'ROOT CAUSE: Next.js streams its own RSC hydration payload via inline <script> tags on every single page (the `(self.__next_f=self.__next_f||[]).push(...)` pattern) — framework-wide behavior, not specific to this project''s code. This content differs per page/build, so it cannot be hash-allowlisted in the CSP the way static assets can.'
      - 'NONCE-BASED CSP IS STILL IMPOSSIBLE HERE, confirmed directly from Next''s current docs (fetched during the scaffold-and-verify investigation, not just recalled): "To use a nonce, your page must be dynamically rendered... Static pages are generated at build time, when no request or response headers exist—so no nonce can be injected." Also confirmed: PPR/Cache Components are explicitly documented as incompatible with nonce-based CSP even if dynamic rendering were adopted elsewhere.'
      - 'CORRECTION to the previous claim that "experimental.sri... is the doc-provided hash-based alternative that preserves static generation": re-checked directly against Next''s current CSP guide. SRI''s actual mechanism is tamper-detection via the `integrity` attribute on externally-loaded `<script src>` files — it is NOT a CSP script-src allowlisting mechanism, and Next''s own docs do not confirm it covers INLINE scripts (like the __next_f payload) at all. Do not treat SRI as a solved answer for this problem; it was never actually verified to apply here.'
      - 'DECISION, made explicitly by the user after being shown the three real tradeoffs (allow inline scripts / force dynamic rendering for real nonces / try experimental SRI and accept the uncertainty): script-src carries ''unsafe-inline''. Rationale specific to this project: nothing in this app renders visitor-submitted content back into the page as raw HTML — MDX posts are author-written, not visitor-submitted, and the contact form''s data goes straight to Resend via the API, never reflected in the DOM. There is no actual injection point in this app that a strict script-src would be guarding against, so the residual risk this accepts is low here specifically. This reasoning does NOT generalize to a future feature that renders any user-supplied content as HTML (e.g. comments, a CMS preview) — revisit this decision if one is ever added.'
      - 'style-src also needs ''unsafe-inline'' — Radix/Base UI and the surrounding component ecosystem inject inline styles at runtime; unrelated to the script-src issue above, decided earlier in install-stage.'
      - 'React''s OWN dev-mode debugging also needs eval() (for reconstructing call stacks) and is blocked by CSP without unsafe-eval — confirmed via Next''s dev-mode error overlay. VERIFIED THIS IS DEV-ONLY: React''s own console message states "React will never use eval() in production mode," and a real `next build && next start` production server run showed zero eval-related console output. Do not add unsafe-eval to fix a dev-only cosmetic warning.'
      - 'form-action, frame-ancestors and base-uri do NOT fall back to default-src. Omitting them is a real bypass, not a cosmetic gap.'
      - 'X-XSS-Protection is NOT recommended by OWASP (it has created vulnerabilities). Omit it or set 0. Expect-CT and HPKP are dead.'
      - 'Do NOT copy the OWASP Secure Headers baseline wholesale: its Cache-Control: no-store is for pages with sensitive data and would destroy caching on a blog, and Cross-Origin-Embedder-Policy: require-corp breaks embeds and buys nothing here.'
      - 'headers() in next.config is preferred over vercel.json: Next-native and portable.'
      - 'HSTS preload is a one-way door — removal takes months of browser releases. Not adopted.'
      - 'next.config.mjs changes require a dev-server RESTART — this file is not part of Turbopack''s hot-reload/Fast Refresh coverage. Editing it and expecting the change to apply without restarting the server is a real, easy-to-make mistake.'
    notes: 'https://nextjs.org/docs/app/guides/content-security-policy | https://owasp.org/www-project-secure-headers/ | https://github.com/vercel/next.js/issues/89754 | https://github.com/vercel/next.js/tree/canary/examples/with-strict-csp'

