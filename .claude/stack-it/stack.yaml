    caveats:
      - 'Title-derived slugs break URLs the moment a title is edited — the exact failure W3C warns about in "Cool URIs don''t change". An explicit slug field costs nothing and prevents it permanently.'
      - 'Nothing to preserve from the current site (user-confirmed), so there is no redirect map. This is a one-time free choice.'
      - 'Once live, treat URLs as permanent. Google advises holding any future redirects at least a year.'
    notes: 'https://www.w3.org/Provider/Style/URI'

  - slot: crawl and indexing control
    choice: Next.js sitemap.ts + robots.ts conventions
    version: n/a (built into Next 16.2.10)
    install:
      - 'Create app/sitemap.ts returning URL entries generated from the content collections'
      - 'Create src/app/robots.ts returning a Robots object (allow all, disallow /api/ and /sentry-tunnel)'
      - 'Serve /llms.txt, /llms-full.txt and per-page markdown mirrors at /llms.mdx/<path> from route handlers (src/app/llms*.txt, src/app/llms.mdx, src/lib/llms.ts)'
    caveats:
      - 'robots.txt is NOT an index-control mechanism — Google is explicit that it "is not a mechanism for keeping a web page out of Google". Use noindex metadata for that.'
      - 'Google''s under-500-pages sitemap exemption genuinely applies here, so the sitemap is courtesy rather than necessity. It is free from the convention, so emit it.'
      - 'AI crawler policy: robots.txt allows every crawler, AI ones included (the site exists to be found). llms.txt is NOT honoured by any known crawler (its own site calls it "a proposal", Google''s AI docs never mention it, Lighthouse marks it optional/N/A; IETF AIPREF''s attach draft expired 2025-10-28). The original decision was not to adopt it; REVERSED in code: the site ships it anyway as a near-free courtesy generated from the same content the pages use.'
    notes: 'https://nextjs.org/docs/app/api-reference/file-conventions/metadata/sitemap | RFC 9309'

  - slot: testing
    choice: Vitest + Testing Library
    version: vitest 4.1.10 | @vitejs/plugin-react 6.0.3 | jsdom 29.1.1 | @testing-library/react 16.3.2 | @testing-library/dom 10.4.1 | vite-tsconfig-paths 6.1.1 | @vitest/coverage-v8 4.1.10 (installed, no coverage config wired)
    install:
      - 'npm install -D vitest@4.1.10 @vitejs/plugin-react@6.0.3 jsdom@29.1.1 @testing-library/react@16.3.2 @testing-library/dom@10.4.1 vite-tsconfig-paths@6.1.1 --save-exact'
      - 'vitest.config.mts defines two projects: a jsdom project (setupFiles: vitest.setup.ts) and a "storybook" browser project from @storybook/addon-vitest that runs stories headless in Chromium via @vitest/browser-playwright; pnpm test runs both'
      - 'vitest.setup.ts is load-bearing: manual RTL cleanup (16.3.2 has no /vitest auto-cleanup entrypoint), a window.matchMedia polyfill answering matches: false (ScrollTrigger calls it at module load), and ScrollTrigger.disable() after the run so its sync interval cannot outlive jsdom'
      - 'Add to package.json scripts:  "test": "vitest"'
    caveats:
      - 'Vitest 4.1.10 published 2026-07-06 (10 days) — outside the window AND patched against all three June 2026 CVEs. There is no cooldown-vs-CVE conflict here.'
      - 'Patched: GHSA-5xrq-8626-4rwp (UI arbitrary file read, fixed 4.1.0+), GHSA-2h32-95rg-cppp (browser-mode otelCarrier XSS, fixed 4.1.6+), GHSA-g8mr-85jm-7xhm (browser CDP proxy RCE, fixed 4.1.8+).'
      - 'DOCUMENTED LIMITATION: "Since async Server Components are new to the React ecosystem, Vitest currently does not support them." Sync Server and Client Components test fine; async Server Components need E2E. Plan the slice accordingly.'
      - 'The highest-value tests here are the two route handlers — the form and newsletter endpoints. Most other correctness is caught by build-time gates (typecheck, zod schema validation), not a test runner.'
      - 'Vitest peers vite ^6 || ^7 || ^8 — Vite 8 is fine.'
      - 'INSTALL-TIME CONFLICT, resolved: @vitejs/plugin-react''s optional peer @rolldown/plugin-babel (only needed for React Compiler support, unused here) pulled Babel 8, conflicting with shadcn''s own Babel 7 toolchain already installed. npm eagerly tries to resolve optional peers and hard-fails the whole install on a conflict rather than skipping them. Fixed with an "@babel/core": "7.29.7" override — satisfies both shadcn''s need and @rolldown/plugin-babel''s own peer range (^7.29.0 || ^8.0.0-rc.1), so peer-dep checking stayed on everywhere else. LOCATION CHANGED when the project switched to pnpm: this override now lives in pnpm-workspace.yaml''s overrides map, not package.json — pnpm does not read a top-level "overrides" field from package.json at all (confirmed against pnpm''s own package.json schema docs, which lists no such field). Verified after the switch: exactly one @babel/core version (7.29.7) resolved in the pnpm virtual store, no duplicate Babel 8 anywhere in the tree.'
      - 'fsevents@2.3.3 (Vite''s macOS file watcher, via vite@8.1.4) needed its install script approved under npm 12 — legitimate, approved.'
    notes: 'https://nextjs.org/docs/app/guides/testing/vitest'

  - slot: component workshop
    choice: Storybook (Next.js Vite framework)
    version: 10.4.6 (storybook, @storybook/nextjs-vite, @storybook/addon-vitest, @storybook/addon-a11y) | playwright 1.61.1 | @vitest/browser-playwright 4.1.10
    install:
      - 'npx create-storybook@10.4.6 --type nextjs --builder vite --package-manager npm --features docs test a11y --yes --no-dev --disable-telemetry'
      - 'This installs @storybook/addon-docs alongside addon-vitest and addon-a11y (from --features docs) — an addition beyond the original plan, kept since it is legitimate first-party Storybook tooling, not a supply-chain concern.'
      - 'REMOVE @chromatic-com/storybook after install — see caveats. `npm uninstall @chromatic-com/storybook` and strip it from .storybook/main.ts addons array.'
      - 'FIX vite version after install — see caveats. Check package.json; if it was written as a `^` range for a version published inside the cooldown window, pin it to the nearest vetted patch exactly.'
      - 'ADD to .storybook/preview.tsx — the CLI does NOT do this automatically: import "../src/app/globals.css"'
      - 'Playwright browsers install automatically as part of create-storybook when --features test is selected; no separate `npx playwright install` needed in current versions.'
    caveats:
      - 'Pinned 10.4.6 (published 2026-06-16, 30 days) rather than 10.5.2 — Storybook shipped TWO releases on 2026-07-16, and no 10.5.x has cleared the cooldown window. create-storybook@10.4.6 exists as a resolvable version, so the pin is real and will not fall through to latest.'
      - 'INSTALL-TIME DIVERGENCE #1: the CLI writes vite as a `^` range, not an exact pin, and it can point at a version published the same day as install — confirmed in practice (wrote "^8.1.5", published that day, while node_modules had already resolved 8.1.4 at 7 days/vetted, an internally inconsistent state npm did not reconcile on its own). Always check and pin vite exactly after this CLI runs.'
      - 'INSTALL-TIME DIVERGENCE #2: @chromatic-com/storybook (a SaaS visual-testing integration) is added by every nextjs/vite Storybook scaffold regardless of which --features are selected — no CLI flag excludes it. It was never part of this stack''s decisions. Remove it after install: uninstall the package and delete it from .storybook/main.ts''s addons array.'
      - 'INSTALL-TIME DIVERGENCE #3: .storybook/preview.tsx does NOT import globals.css by default, even though this is exactly the step needed for Tailwind to render in the Storybook canvas. Add the import manually. Verify with a real `npm run build-storybook`, not just that the install succeeds — that is what actually proves Tailwind, the Radix-based components, and every addon compose correctly.'
      - 'Next 16 IS supported: @storybook/nextjs-vite@10.4.6 peers next ^14.1.0 || ^15.0.0 || ^16.0.0. The docs never state this; the package manifest does. All 10.4.6 packages peer storybook ^10.4.6 consistently.'
      - 'TAILWIND RESOLVED: @storybook/nextjs-vite reuses Next''s own PostCSS config automatically ("this framework will automatically handle your PostCSS config for you"). Do NOT add @tailwindcss/vite to viteFinal — that is only needed for non-Next Vite frameworks. If the framework pin ever changes to @storybook/react-vite, that changes.'
      - '@storybook/nextjs-vite@10.4.6 declares NO typescript peer (the >= 4.9.x constraint appears only at 10.5.2), so TypeScript 6.0.3 is unconstrained.'
      - 'Storybook runs a Vite pipeline alongside Next 16''s Turbopack. Two bundlers in one repo is inherent to this choice.'
      - 'Playwright browsers download via the explicit `npx playwright install` CLI command, NOT an npm lifecycle script — so npm 12''s script blocking does not interfere.'
      - 'CVE-2026-27148 (dev-server WebSocket hijacking → XSS/RCE) is fixed in 10.2.10; 10.4.6 is well past it. Dev server only, never production.'
      - 'GHSA-8452-54wp-rmv6: a PUBLISHED Storybook build can expose .env variables. Do not deploy the Storybook output publicly.'
      - 'Honest note: Storybook positions itself as a workshop for teams sharing design systems. For a solo personal site it is a real setup and maintenance cost. Retained at user request.'
    notes: 'https://storybook.js.org/docs/get-started/frameworks/nextjs-vite | https://storybook.js.org/docs/writing-tests/integrations/vitest-addon'

  - slot: linting/formatting
    choice: Biome (lint + format in one tool)
    version: 2.5.3
    install:
      - 'npm install -D -E @biomejs/biome@2.5.3'
      - 'npx @biomejs/biome init'
      - 'Add scripts:  "lint": "biome lint", "format": "biome format --write", "check": "biome check --write"'
    caveats:
      - 'Pinned 2.5.3 (2026-07-08, 8 days) not 2.5.4 (1 day old). 2.5.4 is confirmed a pure bugfix/perf release with no security content, so nothing is lost by waiting.'
      - 'Next 16 removed `next lint` and `next build` no longer lints. Linting must be wired up explicitly — it is not a framework default any more.'
      - 'Chosen over ESLint + Prettier partly to avoid that dependency corner: eslint-config-prettier was compromised in CVE-2025-54313 (malicious install.js). One tool, far fewer packages.'
      - 'Biome auto-detects the react and next domains from package.json and enables their recommended rules with no config.'
      - 'Biome''s a11y rule group covers most eslint-plugin-jsx-a11y equivalents and is on by default — so eslint-plugin-jsx-a11y is not needed. Parity is not 100%; verify any specific rule you depend on.'
      - 'Next 16 ships no Biome migration codemod (the codemod is ESLint-only), but create-next-app offers Biome as a first-class linter choice.'
      - 'INSTALL-TIME FIX #1: Biome''s CSS parser does not understand Tailwind v4 directives (@apply, @plugin, @theme) by default and aborts formatting globals.css with a parse error. Fix: add `"css": { "parser": { "tailwindDirectives": true } }` to biome.json — Biome''s own error message names the exact option.'
      - 'INSTALL-TIME FIX #2: `biome check --write` flagged lint/a11y/noSvgWithoutTitle on the Storybook onboarding SVGs under src/stories/ and create-next-app''s demo icons in public/. Both were excluded rather than hand-fixed. CURRENT (2026-08-27): src/stories/ is gone, so biome.json has `"files": { "includes": ["**", "!public", "!.impeccable"] }`, with vcs.useIgnoreFile, tab indentation, double quotes, and organizeImports on.'
      - 'Run `biome check --write` for real against the actual codebase as the verification step here, not just confirm the config parses — that is what surfaces gaps like the two above.'
    notes: 'https://biomejs.dev/guides/getting-started/ | https://biomejs.dev/linter/domains/'

  - slot: accessibility target
    choice: WCAG 2.2 AA
    version: n/a (policy)
    install:
      - 'Rely on Biome a11y rules at lint time and @storybook/addon-a11y in the workshop'
      - 'Honor prefers-reduced-motion per component: useReducedMotion (mount-gated) on the Motion side, gsap.matchMedia() on the GSAP side'
    caveats:
