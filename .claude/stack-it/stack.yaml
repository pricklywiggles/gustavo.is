  - slot: transactional email delivery
    choice: Resend
    version: 6.17.2 (+ react-email 6.6.9, optional templating)
    install:
      - 'npm install resend@6.17.2 --save-exact'
      - 'npm install react-email@6.6.9 --save-exact   # optional templating — see divergence note'
      - 'Route handler: const resend = new Resend(process.env.RESEND_API_KEY); await resend.emails.send({ from, to, subject, react })'
      - 'Add gustavo.is in the Resend dashboard and copy the generated SPF/DKIM/MX records into Vercel DNS'
      - 'Env: RESEND_API_KEY (required; without it /api/contact returns a graceful 500), CONTACT_EMAIL_TO and RESEND_FROM as optional overrides (see .env.example)'
    caveats:
      - 'INSTALL-TIME CORRECTION: @react-email/components@1.0.12, as originally pinned here, is DEPRECATED — "Package no longer supported" on every package in its dependency tree. Confirmed via the official react-email 6.0.0 release notes this was intentional, not an accident: all @react-email/* sub-packages (components, button, html, etc.) were consolidated directly into the `react-email` package itself. Official migration: `import { Button, Html, Head, render } from "react-email"` instead of from @react-email/components. It also moves to dependencies, not devDependencies — it now exports render, not just components.'
      - 'Installed react-email@6.6.9, not the 6.9.0 latest — 6.9.0 was published one day before install (2026-07-15), inside the cooldown window. 6.6.9 is the nearest version that had cleared 7 days at install time.'
      - 'Published 2026-07-08 (8 days) — clears the window by one day.'
      - 'Free tier: 3,000 emails/month, capped at 100/day, 1 domain, 30-day data retention. Ample for a personal contact form.'
      - 'Resend recommends sending from a SUBDOMAIN (e.g. send.gustavo.is) to isolate sending reputation from the apex domain.'
      - 'API rate limit is 5 requests/second per team; exceeding returns HTTP 429.'
      - 'NEVER let the recipient or subject be caller-controlled — OWASP classes form-to-email relay abuse as an implementation flaw. Hardcode the recipient.'
      - 'Encode submission content wherever it renders, including in the notification email itself.'
      - 'CSRF tokens are NOT applicable here — a cookie-less third-party endpoint has no session to ride.'
      - 'The exact DNS values are domain-specific and only appear in the Resend dashboard after adding the domain.'
    notes: 'https://resend.com/docs/send-with-nextjs | https://resend.com/docs/dashboard/domains/introduction'

