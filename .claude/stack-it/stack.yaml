format: 2
project:
  description: Personal site at gustavo.is. About, two project retrospectives under /remembering, and a blog, with a contact form. Rebuild of an existing live site (no URLs to preserve). Operator US-based. Blog posts as MDX files in-repo; retrospectives as typed data. Fully prerendered except one dynamic route handler (/api/contact); the newsletter endpoint is decided but not built.
  type: web-app
  platforms: [web]
stack:
  - slot: language/runtime
    choice: Node.js
    version: 24.x
    install:
      - 'nvm install 24 && nvm use 24'
      - 'Add to package.json: "engines": { "node": "24.x" }'
    caveats:
      - 'Vercel does NOT support Node 26. Only 24.x (default), 22.x, 20.x are available. Local machine ran Node 26.0.0 at decision time (a dev/prod split); it now runs 24.19.0 via volta, matching the pin.'
      - 'Node 24 is Active LTS. Node 26 becomes LTS Oct 2026; revisit then.'
      - 'engines.node in package.json overrides the Vercel Project Settings dropdown. Only major versions are selectable; Vercel auto-patches minor/patch.'
      - 'Corepack was removed from Node 25+, so it is present on this project''s Node 24 pin only. NOW RELEVANT: the project switched to pnpm (see package manager slot), and Vercel does not honor package.json''s "packageManager" field without Corepack explicitly enabled via the ENABLE_EXPERIMENTAL_COREPACK=1 project env var.'
    notes: 'https://vercel.com/docs/functions/runtimes/node-js/node-js-versions — doc last updated 2026-02-27; Node 20 sunset date not stated there, re-check nearer launch.'

  - slot: package manager + lockfile
    choice: pnpm
    version: 11.11.0
    install:
      - 'pnpm --version  # verify 11.11.0 (already installed locally)'
      - 'pnpm import  # converts an existing package-lock.json to pnpm-lock.yaml, preserving exact resolved versions rather than a fresh re-resolve'
      - 'pnpm install  # commit pnpm-lock.yaml'
      - '"packageManager": "pnpm@11.11.0" in package.json'
    caveats:
      - 'RE-PICKED from npm mid-pipeline, after install-stack and scaffold-and-verify had both already run to completion on npm 12.0.1. Deliberate user request, not a correction — npm was researched, pinned, installed, and fully verified working before this switch.'
      - 'Migrated with `pnpm import` (not a fresh `pnpm install`), specifically to preserve the exact already-vetted resolved versions from package-lock.json rather than let pnpm re-resolve semver ranges to whatever is newest today — re-resolving would have silently undone every cooldown-aware version pin this whole pipeline made.'
      - 'Verified the conversion actually preserved versions, not just that it ran: compared the pnpm install dependency tree output against package.json — every version matched exactly.'
      - 'Vercel''s package-managers doc (updated 2026-07-01) lists supported pnpm majors as 6, 7, 8, 9, 10 — pnpm 11 is NOT listed, the same gap npm 12 had. Auto-detection is by pnpm-lock.yaml''s lockfileVersion field, not an explicit version entry, so this is a documentation-lag caution, not proof of failure.'
      - 'Pinning on Vercel needs Corepack: "packageManager": "pnpm@11.11.0" alone is NOT respected by Vercel out of the box. Requires the ENABLE_EXPERIMENTAL_COREPACK=1 project env var, or an explicit installCommand in vercel.json. Without either, an explicit `pnpm install` override falls back to the OLDEST pnpm in Vercel''s build image (pnpm 6) — a real, easy-to-hit trap.'
      - '`pnpm run <script> <args>` differs from npm''s argument-passing convention: pnpm forwards trailing args to the underlying command directly (`pnpm run dev -p 4200`). Including npm''s explicit `--` separator (`pnpm run dev -- -p 4200`) breaks it — Next.js received a literal "-p" as its project directory argument and failed to start. Confirmed by hitting this directly.'
      - 'pnpm 11.11.0 published 2026-07-09 — 7-8 days old at switch time, right at this project''s own 7-day cooldown boundary but past it. No GHSA/CVE advisory affects 11.11.0; the one 11.x-line advisory (path traversal via manifest version, CAND-PNPM-038) was fixed by 11.5.3, well before this pin.'
      - 'EVERY OTHER SLOT''S `install:` list in this file still shows `npm install <pkg> --save-exact` — those are accurate, unedited HISTORICAL records of the exact command run when that package was first installed, before this switch. They are not wrong, just no longer the reproduction path. For any package added from here forward, use `pnpm add <pkg>@<version> --save-exact` (or `pnpm add -D` for devDependencies) instead.'
    notes: 'https://pnpm.io/cli/import | https://vercel.com/docs/package-managers | https://vercel.com/docs/deployments/configure-a-build#corepack'

  - slot: supply-chain policy
    choice: pnpm allowBuilds allowlist + minimumReleaseAge cooldown, both in pnpm-workspace.yaml
    version: n/a (configuration)
    install:
      - 'Create pnpm-workspace.yaml containing minimumReleaseAge: 10080 (minutes — 7 days, matching this project''s original npm policy, not pnpm''s own weaker 1440/24h default)'
      - 'Add allowBuilds: { sharp: true, esbuild: true, fsevents: true, "@sentry/cli": false } to the same file, after individually reviewing each package'
      - 'Add overrides: { "@babel/core": "7.29.7" } to the same file (see the testing slot); pnpm does not read package.json overrides'
      - 'pnpm approve-builds  # interactive alternative to hand-editing allowBuilds; pnpm approve-builds --all approves everything pending non-interactively'
      - 'git add pnpm-workspace.yaml  # must be committed so the allowlist and cooldown reach CI'
    caveats:
      - 'RE-PICKED when the project switched from npm to pnpm (see package manager slot). This is the pnpm-native equivalent of the same policy, not a new decision.'
      - 'CRITICAL, VERSION-SPECIFIC: onlyBuiltDependencies (the pnpm mechanism this project would have used on an earlier pnpm major) was REMOVED in pnpm v11 — replaced by allowBuilds, which is a package-name -> boolean MAP, not a plain array. Also removed in v11: onlyBuiltDependenciesFile, neverBuiltDependencies, ignoredBuiltDependencies, ignoreDepScripts. Any pre-v11 pnpm documentation or muscle memory describing this will be wrong for this pin.'
      - 'CRITICAL, FILE LOCATION: minimumReleaseAge and allowBuilds both live in pnpm-workspace.yaml, NOT .npmrc and NOT package.json. pnpm does not read npm''s min-release-age key from .npmrc at all.'
      - 'pnpm blocks dependency build/install/postinstall scripts BY DEFAULT, same posture as npm 12 — nothing here is a downgrade in strictness from the npm-era policy.'
      - 'fsevents did not actually resolve into pnpm''s dependency tree in this project (npm needed it twice, via vite and playwright separately) — pnpm''s optional-dependency resolution differs from npm''s here. Kept in allowBuilds defensively in case a future dependency change reintroduces it; harmless if unused.'
      - '@sentry/cli is explicitly denied (false): its postinstall only falls back to a binary download that the @sentry/cli-<platform> optional dependency already provides, so approving it would add nothing but one more trusted script.'
      - 'Provenance is not a malware check: the TanStack wave (May 2026) published packages carrying valid SLSA Build L3 attestations. Do not treat provenance as a safety signal. (Carried over from the npm-era policy — still true regardless of package manager.)'
      - 'Do not enable auto-merge for dependency updates — cooldown plus auto-merge still auto-merges, just later. (Also carried over — still applies.)'
    notes: 'https://pnpm.io/settings | https://pnpm.io/cli/approve-builds | CISA axios alert 2026-04-20 | OWASP Top 10:2025 A03'

  - slot: site framework/generator
    choice: Next.js (App Router)
    version: 16.2.10
    install:
      - 'npx create-next-app@16.2.10 . --typescript --app --no-eslint --use-npm'
      - 'npm install next@16.2.10 react@19.2.7 react-dom@19.2.7 --save-exact'
    caveats:
      - 'Published 2026-07-01 (15 days) — just outside the cooldown window.'
      - 'Next 16 REMOVED `next lint`, and `next build` no longer runs linting. The `eslint` key in next.config is also gone. Linting is now a separate step (see Biome).'
      - 'Turbopack is the default bundler in Next 16 for both dev and build.'
      - 'React2Shell (CVE-2025-55182 / CVE-2025-66478, CVSS 10.0, RSC RCE, actively exploited from 2025-12-05) is fixed in React 19.2.1+ / Next 16.0.7+. These pins are well past it — not affected.'
      - 'Do NOT use output: "export" — it disables Route Handlers that read request data, which the contact form and newsletter both need.'
      - 'Never enable SPA-fallback routing: it returns 200 OK for unmatched paths and destroys real 404s on a blog.'
    notes: 'https://nextjs.org/docs/app/guides/upgrading/version-16 | https://react.dev/blog/2025/12/03/critical-security-vulnerability-in-react-server-components'

  - slot: type system
    choice: TypeScript
    version: 6.0.3
    install:
      - 'npm install -D typescript@6.0.3 --save-exact'
    caveats:
      - 'DELIBERATELY NOT 7.0.2. TypeScript''s own announcement: "TypeScript 7.0 does not yet expose a stable programmatic API, and so tools ... can only currently rely on TypeScript 6.0." This blocks any compiler-API consumer.'
      - '@typescript-eslint/eslint-plugin@8.64.0 declares peer "typescript": ">=4.8.4 <6.1.0" — it does not support 7.0, or even 6.1. Not a blocker here since we use Biome, but it shows how far the ecosystem is from 7.0.'
      - 'Next 16 declares a TypeScript FLOOR of 5.1.0 and no ceiling — it does not bless or block 7.0.'
      - '@storybook/nextjs-vite@10.4.6 declares NO typescript peer at all (the >= 4.9.x peer appears only at 10.5.2), so 6.0.3 is unconstrained here.'
      - 'Revisit at TypeScript 7.1, which is when the stable programmatic API is expected. 6.0.3 published 2026-04-16 (91 days) — well vetted.'
    notes: 'https://devblogs.microsoft.com/typescript/announcing-typescript-7-0/'

  - slot: rendering model
    choice: Fully prerendered static, with one dynamic route handler (/api/contact)
    version: n/a (architecture)
    install:
      - 'Leave pages statically rendered by default (App Router default).'
      - 'Optionally enable in next.config.mjs:  const nextConfig = { cacheComponents: true }'
      - 'Keep src/app/api/contact/route.ts as an ordinary dynamic Route Handler; src/app/api/subscribe/route.ts is planned (newsletter slot) but not built.'
    caveats:
      - 'experimental.ppr is REMOVED in Next 16 — superseded by Cache Components. cacheLife/cacheTag are now stable (no unstable_ prefix).'
      - 'cacheComponents is opt-in, not default. An about/portfolio/blog has no per-request input, so plain static is already correct; enable Cache Components only if a real need appears.'
    notes: 'https://nextjs.org/docs/app/api-reference/config/next-config-js/cacheComponents | web.dev "Rendering on the Web"'

  - slot: styling approach
    choice: Tailwind CSS
    version: 4.3.2
    install:
      - 'npm install tailwindcss@4.3.2 @tailwindcss/postcss@4.3.2 postcss@8.5.16 --save-exact'
      - 'Create postcss.config.mjs:  const config = { plugins: { "@tailwindcss/postcss": {} } }; export default config;'
      - 'In app/globals.css:  @import "tailwindcss";'
    caveats:
      - 'NOT 4.3.3 — that shipped 2026-07-16 (today), inside the cooldown window. 4.3.2 published 2026-06-29 (17 days).'
      - 'Tailwind v4 is CSS-first: no tailwind.config.js. Tokens go in @theme.'
      - 'Open friction with Next 16 + Turbopack: PostCSS plugin warnings (vercel/next.js #88443, #90860) and arbitrary-value classes reportedly dropped under Turbopack in some 16.1.x builds (tailwindlabs/tailwindcss #19825). Unresolved upstream — expect noise, not breakage.'
    notes: 'https://tailwindcss.com/docs/installation/framework-guides/nextjs'

  - slot: browser support target
    choice: Tailwind v4 floor — Safari 16.4+, Chrome 111+, Firefox 128+
    version: n/a (policy)
    install:
      - 'Add to package.json:  "browserslist": ["Safari >= 16.4", "Chrome >= 111", "Firefox >= 128"]'
    caveats:
      - 'This is set BY Tailwind v4, not chosen independently — v4 core depends on @property, color-mix(), and cascade layers. Tailwind 3.4 would be required for broader support.'
      - 'Safe to rely on (Baseline Widely Available as of June 2026): CSS nesting, :has(), loading="lazy".'
      - 'Enhancement only (Baseline Newly, not Widely): light-dark(), @property, text-wrap: balance, view transitions, AVIF, fetchpriority.'
    notes: 'https://tailwindcss.com/docs/compatibility | web.dev/baseline'

  - slot: prose/long-form typographic styling
    choice: "@tailwindcss/typography"
    version: 0.5.20
    install:
      - 'npm install -D @tailwindcss/typography@0.5.20 --save-exact'
      - 'In app/globals.css after the tailwind import:  @plugin "@tailwindcss/typography";'
      - 'Wrap rendered MDX:  <article className="prose">{content}</article>'
    caveats:
      - 'v4 registration is the @plugin directive in CSS — there is no config file to add it to.'
      - 'Customize via @utility with --tw-prose-* variables.'
      - 'dark:prose-invert is not needed — this site is light-only by decision.'
    notes: 'https://github.com/tailwindlabs/tailwindcss-typography (the official tailwindcss.com/plugins/typography page 404s; README is the live source)'

  - slot: UI component primitives
    choice: Base UI
    version: 1.6.0
    install:
      - 'npm uninstall radix-ui'
      - 'npm install @base-ui/react@1.6.0 --save-exact'
      - 'Import per-component, e.g.:  import { Button } from "@base-ui/react/button"'
    caveats:
      - 'RE-PICKED FROM RADIX mid-pipeline, after install-stack had already installed and verified radix-ui@1.6.2. User asked to compare the two, then explicitly chose to switch. This is a deliberate re-decision, not a correction of an error — the original Radix pick was researched, pinned, and working.'
      - 'Package name matters: the current package is @base-ui/react. @base-ui-components/react (the old name) is DEPRECATED — "Package was renamed to @base-ui/react". Do not install the old name.'
      - 'Base UI is a joint effort between Radix''s original creators, the MUI (Material UI) team, and Floating UI — a new API (uses a `render` prop instead of Radix''s `asChild`/Slot pattern) built from accumulated experience, not Radix under a new name.'
      - 'Maturity gap vs what was replaced: Base UI hit 1.0 on 2025-12-11 (~7 months old at switch time) vs Radix''s 1.0 on 2022-12-21 (~3.5 years). Weekly downloads ~5.9M vs Radix''s 60-146M depending on which package is counted — Radix has far more production hours behind it. Component coverage is broad (40+) but Hover Card was not found in Base UI''s current component list; verify before relying on it.'
      - 'Confirmed still-active, NOT a case of Radix being sidelined: shadcn''s own July 2026 changelog states "Radix is not being deprecated. We still support it, and every update and new component will ship for both libraries." Radix''s GitHub repo showed commits the day before and the day of this switch — independently verified, not just taking shadcn''s word for it.'
      - 'The concrete reason this switch is defensible for THIS project: Base UI ships a first-party CSPProvider and this site runs a strict Content-Security-Policy (see security response headers slot). Radix has no equivalent.'
      - 'shadcn''s own reasoning (verbatim from their changelog) is adoption/stability signal, not a technical-superiority claim: "Base UI is stable... 6M+ weekly downloads... Projects created on shadcn/create now pick Base UI over Radix 2 to 1. The community already made the call." That adoption-ratio figure is shadcn''s own internal telemetry, not externally auditable.'
      - 'Zero GHSA/CVE advisories found for either @base-ui/react or radix-ui at the versions involved.'
    notes: 'https://base-ui.com/react/overview/quick-start | https://ui.shadcn.com/docs/changelog/2026-07-base-ui-default | https://github.com/mui/base-ui'

  - slot: component layer/design system
    choice: shadcn/ui (copy-in components via CLI)
    version: 4.13.0 (CLI only — components become your source)
    install:
      - 'npx shadcn@4.13.0 init --base base --preset nova --template next --yes --reinstall'
      - '(Switching an already-initialized project between base libraries also needs --force, and the CLI still asks a y/N confirmation that --yes does not cover — pipe it: printf "y\n" | npx ...)'
      - 'npx shadcn@4.13.0 add button   # etc, per component'
    caveats:
      - 'RE-PICKED: this project switched from Radix to Base UI mid-pipeline (see UI component primitives slot for the full rationale). --base now reads `base`, not `radix`. shadcn changed its DEFAULT to Base UI in July 2026 (changelog 2026-07-base-ui-default) — --base still must be passed explicitly regardless of which library you want, since relying on the default means a future shadcn release could flip it again without warning.'
      - 'SWITCHING AFTER INIT has its own prompts beyond first-init: re-running init with a different --base on a project that already has components.json shows "Would you like to re-install existing UI components?" (needs --reinstall) and then a distinct "You are switching from radix to base... Would you like to continue?" confirmation that neither --yes nor --force covers — pipe "y\n" via stdin. Verify the switch actually happened by reading components.json''s "style" field and the regenerated component''s import line directly; do not trust the flags alone.'
      - 'shadcn is copy-in, not a runtime dependency. Pinning the CLI pins nothing upstream — once copied, components are your code, frozen until you re-run add/diff/migrate.'
      - 'CLI published 2026-07-03 (13 days). npx bypasses min-release-age, so cooldown does not protect this invocation.'
      - 'Registry installs fetch component source over HTTP from a registry URL at runtime. That fetch is outside npm''s --allow-remote gate. Only use the official @shadcn registry; third-party registries are an arbitrary-code-execution path.'
      - 'components.json writes a legacy `tailwind.config` key — vestigial under v4 CSS-first config. The `css` field is the one that matters.'
      - 'INSTALL-TIME DIVERGENCE (recorded here per the install-stack contract): `init` is no longer a single non-interactive command even with -y. It now prompts for a named preset (Nova/Vega/Maia/Lyra/Mira/Luma/Sera/Rhea/Custom) regardless of --yes. -b/--base radix and -p/--preset nova together produced components.json with "style": "radix-nova" and button.tsx importing { Slot } from "radix-ui" — confirmed Radix, not Base UI. --defaults would have silently pulled preset base-nova (Base UI) instead; do not use --defaults on this CLI version.'
      - 'init pulled real runtime infrastructure not anticipated by Phase 2 research: class-variance-authority 0.7.1, clsx 2.1.1, tailwind-merge 3.6.0, lucide-react 1.24.0 (iconLibrary: lucide in components.json), tw-animate-css 1.4.0, plus `@import "shadcn/tailwind.css"` and `@import "tw-animate-css"` in globals.css. All legitimate current shadcn 4.13 architecture; keep them. They are the only caret-ranged entries in package.json, and components.json records style "base-nova".'
      - 'init OVERWRITES globals.css and layout.tsx without asking: it injected its own next/font/google Geist import into layout.tsx (clobbering an existing next/font/local wiring) and wrote a circular `--font-sans: var(--font-sans)` in globals.css plus a full .dark {} variable block. If a font is already wired before running init, re-point --font-sans/--font-heading at the real font variable afterward and check layout.tsx for an injected Google Font import.'
      - 'Do NOT strip the @custom-variant dark (&:is(.dark *)) line even on a light-only site — every generated component ships dark: utility classes, and this selector is what keeps them permanently inert (nothing ever applies a .dark class). Removing it makes dark: fall back to Tailwind''s prefers-color-scheme default, which partially dark-shifts components on OS dark mode while the rest of the site stays light. Do strip the .dark {} variable block itself — those values are genuinely dead code when no toggle ever applies the class.'
      - 'The shadcn CLI package itself must be in devDependencies, not dependencies — plain `npm install` without -D during any manual step will misfile it.'
      - 'A separate, SESSION-LEVEL quarantine hook (independent of this project''s own .npmrc min-release-age policy) blocked re-invoking shadcn@4.13.0 for the Base UI switch: it had crossed the hook''s own 14-day boundary as real time passed since the original init. This was the SAME already-installed, already-verified CLI version used earlier in the same session for the original Radix init — overridden via the hook''s own documented override flag after confirming it was a re-use of an already-vetted package, not a fresh unvetted install. If this fires on a truly new install, do not override without actually vetting the package first.'
    notes: 'https://ui.shadcn.com/docs/installation/next | https://ui.shadcn.com/docs/changelog/2026-02-radix-ui | https://ui.shadcn.com/docs/changelog/2026-07-base-ui-default'

  - slot: content source/authoring pipeline
    choice: fumadocs-mdx (used standalone as a content layer, without fumadocs-ui)
    version: 15.1.0
    install:
      - 'npm install fumadocs-mdx@15.1.0 fumadocs-core@16.11.0 @types/mdx@2.0.14 --save-exact'
      - 'Create next.config.mjs (MUST be .mjs):  import { createMDX } from "fumadocs-mdx/next"; const withMDX = createMDX(); export default withMDX(config);'
      - 'Create source.config.ts with one defineCollections call for blog (content/blog), with postprocess.includeProcessedMarkdown for the /llms.mdx mirrors; the runtime loader is src/lib/source.ts'
      - 'The .source folder is generated automatically on `next dev` / `next build` — do not commit it'
    caveats:
      - 'Published 2026-07-07 (9 days) — vetted. 15.2.0 (1 day old) deliberately excluded; its only change is an additive, opt-in macro API.'
      - 'Confirmed usable WITHOUT fumadocs-ui: neither fumadocs-mdx nor fumadocs-core depends on it. We keep our own Tailwind/shadcn design.'
      - 'Turbopack works. fumadocs-mdx sidesteps the JS→Rust serialization limit by reading source.config.ts in Node rather than passing plugin functions as Turbopack loader options. This is exactly why raw @next/mdx would have been painful here.'
      - 'peerDependencies: next ^15.3.0 || ^16.0.0, react ^19.2.0, fumadocs-core ^16.7.0 — all satisfied.'
      - 'Depends on zod ^4.4.3 — exactly our pin.'
      - 'No postinstall/preinstall scripts — nothing to allowlist under npm 12.'
      - 'fumadocs-core 16.11.5 is 1 day old; pinning 16.11.0 (9 days) instead.'
      - 'No blog-preset schema ships with it — define your own zod object for title/date/tags/draft/description. Sorting and filtering are plain array ops over source.getPages(), not a library API.'
      - 'It is a docs framework''s content layer. Adopted deliberately for Turbopack support; if it ever starts imposing a docs-site worldview, @next/mdx + gray-matter + zod is the fallback.'
      - 'The work collection this slot originally defined was deleted: the portfolio retrospectives are typed-data pages at /remembering/* (src/components/retrospective/), not MDX. blog is the only collection.'
    notes: 'https://www.fumadocs.dev/docs/mdx/next | https://www.fumadocs.dev/docs/mdx/collections | https://www.fumadocs.dev/docs/mdx/performance'

  - slot: content format
    choice: MDX
    version: n/a (via fumadocs-mdx 15.1.0)
    install:
      - 'Content lives in content/blog/*.mdx (the only collection)'
    caveats:
      - 'MDX''s own docs acknowledge it breaks some Markdown: "Indented code does not work in MDX", and autolinks do not work. Use fenced code blocks.'
      - 'CommonMark 0.31.2 and GFM 0.29 are frozen specs — stable, not abandoned.'
    notes: 'https://mdxjs.com/docs/what-is-mdx/'

  - slot: schema validation
    choice: Zod
    version: 4.4.3
    install:
      - 'npm install zod@4.4.3 --save-exact'
      - 'Use for BOTH the frontmatter schema (source.config.ts) and the contact payload (src/lib/contact-schema.ts, shared by the client form and the route handler so validation cannot drift)'
    caveats:
      - 'Published 2026-05-04 (73 days) — well vetted. Exactly the version fumadocs-mdx depends on.'
      - 'Zod 4 breaking changes from v3: .strict()/.passthrough() deprecated in favour of z.strictObject()/z.looseObject(); defaults now apply within optional fields.'
      - 'GHSA-m95q-7qp3-xv42 (email-validation DoS) affects <3.22.3 only — not applicable.'
      - 'Server-side validation is mandatory for the form endpoints; client validation is a UX nicety, not a control.'
    notes: 'https://zod.dev/v4/changelog | OWASP Top 10 (untrusted input)'

  - slot: syntax highlighting
    choice: Shiki (build-time, bundled via fumadocs-core)
    version: n/a (transitive — fumadocs-core 16.11.0 depends on shiki ^4.2.0)
    install:
      - 'No separate install — do NOT add shiki or rehype-pretty-code manually'
      - 'Configure in source.config.ts:  defineConfig({ mdxOptions: { rehypeCodeOptions: { themes: { light: codeTheme }, defaultColor: "light", icon: false } } }) with codeTheme from src/lib/code-theme.ts; pass themes (plural), since a bare theme key loses to the preset default in the shallow merge'
    caveats:
      - 'Build-time, so no parser or grammars ship to readers.'
      - 'Configuring via rehypeCodeOptions (rather than raw rehype plugin functions) is what keeps this Turbopack-safe.'
    notes: 'https://www.fumadocs.dev/docs/headless/mdx/rehype-code'

  - slot: web fonts/typography loading
    choice: Wotfard (body) + Kitora Bold (display and legend roles), self-hosted via next/font/local, converted to WOFF2 and subset
    version: n/a (user-supplied licensed files; masters kept outside the repo)
    install:
      - 'pip install "fonttools[woff2]"'
      - 'For each weight:  pyftsubset wotfard-regular-webfont.ttf --flavor=woff2 --output-file=Wotfard-Regular-latin.woff2 --unicodes="U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+2000-206F,U+2074,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD" --layout-features="*"'
      - 'Copy the resulting .woff2 files into src/fonts/ (Kitora-Bold.woff2 prepared the same way, 140KB OTF to 24KB)'
      - 'Define both in src/app/fonts.ts:  localFont({ src: [...seven weights], variable: "--font-wotfard", display: "swap", adjustFontFallback: "Arial" }) and localFont({ src: "../fonts/Kitora-Bold.woff2", weight: "700", variable: "--font-kitora", display: "swap", adjustFontFallback: "Arial" })'
      - 'Apply fontVariables (both variable classes) on <html>; Storybook mirrors that placement in .storybook/preview.tsx because the role tokens resolve at :root'
      - 'In globals.css:  --font-sans: var(--font-wotfard); --font-display: var(--font-kitora); --font-legend: var(--font-kitora)'
    caveats:
      - 'Licensed. Wotfard (Atipo Foundry) and Kitora Bold are both held under their foundry webfont licenses; the records live outside the repo. Only the Latin-subset WOFF2 files ship and the OTF masters are gitignored, which is what foundry licenses ask of self-hosted webfonts.'
      - 'Source files are TTF-only. WOFF2 is ~30-50% smaller for identical glyphs — convert, do not ship TTF.'
      - 'next/font/local does NOT subset local fonts (only Google fonts get automatic subsetting). Pre-subsetting is mandatory, not optional.'
      - 'All seven Wotfard weights ship (100 through 700 in src/app/fonts.ts). Each is ~100KB before conversion; trim any a weight audit shows unused.'
      - 'No italic files exist in the set. Browsers will synthesise oblique; if real italics matter, they must be sourced.'
      - 'next/font self-hosts and preloads automatically; adjustFontFallback: "Arial" supplies fallback metrics to limit layout shift.'
    notes: 'https://nextjs.org/docs/app/api-reference/components/font | https://fonttools.readthedocs.io/en/latest/subset/ | https://www.atipofoundry.com/fonts/wotfard'

  - slot: animation
    choice: Motion (React layout/exit) + GSAP with ScrollTrigger (pinning/scrubbing)
    version: motion 12.42.2 | gsap 3.15.0 | @gsap/react 2.1.2
    install:
      - 'npm install motion@12.42.2 gsap@3.15.0 @gsap/react@2.1.2 --save-exact'
      - 'Motion in RSC: import * as motion from "motion/react-client"  (avoids marking the whole file "use client")'
      - 'Motion elsewhere: "use client" + import { motion } from "motion/react"'
      - 'GSAP: "use client" + gsap.registerPlugin(ScrollTrigger, useGSAP), then useGSAP(() => {...}, { scope: container })'
      - 'Reduced motion is handled per component, not app-wide: Motion''s useReducedMotion (mount-gated, since it is truthy on a reduced client''s first render) and gsap.matchMedia(); there is no <MotionConfig reducedMotion="user"> wrapper'
      - 'For GSAP, branch on reduced motion via gsap.matchMedia() with reduceMotion: "(prefers-reduced-motion: reduce)"'
    caveats:
      - 'BOTH ARE JUSTIFIED, not redundant. GSAP ScrollTrigger does viewport PINNING; Motion documents no equivalent. Motion has layout/AnimatePresence (FLIP + React-tree-aware exit animations); GSAP has no equivalent. Each covers what the other cannot.'
      - 'RULE: never animate the same property on the same element from both libraries — they will fight frame by frame. Assign ownership per element/section.'
      - 'Measured gzip at these exact versions: GSAP core 27.7KB, ScrollTrigger 17.6KB (45.3KB combined). Motion full package 45.4KB, but drops to ~4.6KB with LazyMotion + m, +15KB for domAnimation or +25KB for domMax. Use LazyMotion.'
      - '@gsap/react 2.1.2 (2025-01-15, 547 days) is CONFIRMED THE CORRECT AND ONLY official React package: maintainer greensock, repo greensock/react, single dist-tag, no prerelease. gsap@3.15.0 core has NO ./react subpath — core did not absorb React support.'
      - 'ITS AGE IS NOT A RISK SIGNAL — verified from source, not inferred. The whole of useGSAP is 2,325 bytes and imports only { useEffect, useLayoutEffect, useRef } from react, plus gsap. React 19 removed propTypes/defaultProps on function components, string refs, legacy context, ReactDOM.render and findDOMNode — useGSAP touches none of them. There is nothing here for React 19 to break. The package is dormant because it is feature-complete, not because it is abandoned.'
      - 'PROOF the code path is actively maintained: GSAP core 3.15.0 (2026-04-13) shipped a bugfix explicitly naming useGSAP — "...the ScrollTrigger was created inside a gsap.context() (including in the React useGSAP() hook), they wouldn''t be associated with that context and therefore may not be cleaned up properly". useGSAP is a thin wrapper over gsap.context(), which lives in core; core is maintained (pushed 2026-04-13, only 6 open issues), so the wrapper needs no commits. This bugfix is itself a reason to be on 3.15.0.'
      - 'greensock/react issue #14 ("Please add react-19 support") is NOT a bug report: no repro was given, and Jack Doyle (GSAP''s creator) replied 2025-06-02 asking for "a minimal demo that shows a problem with using GSAP in React 19". The reporter never answered. No React 19 breakage report exists on GitHub or the GSAP forums.'
      - 'No official GreenSock statement confirms OR denies React 19 support — React 19 is simply not mentioned in the docs. Absence of confirmation, not evidence of a problem.'
      - 'ESCAPE HATCH if it ever does break: GreenSock documents useGSAP as "a drop-in replacement for React''s Effects that automatically handles cleanup using gsap.context()". Dropping the dependency means calling gsap.context() inside useEffect and returning ctx.revert() — roughly ten lines, officially documented, with contextSafe() needed only for handlers created outside the initial effect run.'
      - 'MINOR SOURCE-LEVEL WART (internal to the library): useGSAP calls a hook conditionally — `deferCleanup && useIsomorphicLayoutEffect(...)`. Safe in practice because deferCleanup derives from dependencies.length, which is static per call site. But never write a useGSAP call whose dependency array CHANGES LENGTH between renders, or React throws "Rendered fewer hooks than expected".'
      - 'gsap.com docs explicitly cover this exact setup: "If you''re using the app router / react server components, you need to drop a ''use client'' at the top of your file for useGSAP() to work" and "This hook is safe to use in Next or other server-side rendering environments, provided it is used in client-side components." Turbopack is not mentioned either way.'
      - 'GSAP is FREE for commercial use including all former Club plugins (ScrollTrigger, SplitText, MorphSVG) since 2025-04-30 under Webflow. It is NOT open source: a proprietary Standard License that Webflow may terminate at its discretion, barring use in competing no-code animation builders. Irrelevant to this site, but it is a revocable grant, not a right.'
      - 'Motion is MIT. Motion+ (£299 one-time) is optional extras only.'
      - 'Use motion/react imports — NOT framer-motion. Some Motion doc pages still show the old import path.'
      - 'No official guidance exists from either project on running both. Ownership split is a community convention.'
      - 'CVE-2020-28478 (GSAP prototype pollution) affects <3.6.0 — not applicable.'
    notes: 'https://motion.dev/docs/react-installation | https://motion.dev/docs/react-reduce-bundle-size | https://gsap.com/resources/React | https://gsap.com/standard-license/'

