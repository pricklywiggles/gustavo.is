  - slot: form abuse protection
    choice: Vercel BotID (Basic) + accessible honeypot + Vercel Firewall rate limiting
    version: botid 1.5.11
    install:
      - 'npm install botid@1.5.11 --save-exact'
      - 'next.config.mjs:  import { withBotId } from "botid/next/config"; export default withBotId(nextConfig)'
      - 'src/instrumentation-client.ts (Next loads exactly one instrumentation-client file and src/ wins; a root copy is dead):  initBotId({ protect: [{ path: "/api/contact", method: "POST" }] })'
      - 'In each route handler:  const v = await checkBotId(); if (v.isBot) return NextResponse.json({ error: "Access denied" }, { status: 403 })'
      - 'Add a rate-limiting rule in the Vercel Firewall dashboard (Hobby allows 1 rate-limit rule, 3 custom rules total)'
      - 'Honeypot field: <div style="position:absolute;left:-9999px" aria-hidden="true"><label htmlFor="website">Leave empty</label><input id="website" name="website" tabIndex={-1} autoComplete="off" /></div>'
    caveats:
      - 'BotID Basic is FREE on all plans including Hobby. Deep Analysis (Kasada-powered) is Pro/Enterprise only at $1/1000 calls.'
      - 'Vercel Hobby: 3 total custom firewall rules, 1 rate-limiting rule, Fixed Window only (Token Bucket is Enterprise). Window 10s–10min. 1,000,000 included allowed requests.'
      - 'CORRECTION TO EARLIER CLAIM: I previously asserted W3C mandates aria-hidden + tabindex="-1" on honeypots. That could NOT be confirmed in w3.org/TR/turingtest, which only says the field is "hidden from the user by markup such as CSS-Hidden". The aria-hidden + tabIndex pattern is community best practice, not W3C-normative. It IS necessary with off-screen positioning (which does not remove the field from the a11y tree or tab order) — which is why it is used above.'
      - 'What W3C DOES support: "Inaccessibility of CAPTCHA" documents that visual/audio CAPTCHA excludes disabled users and is increasingly ineffective. That is the real argument for honeypot-over-CAPTCHA.'
      - 'BotID blocks curl in production: test via fetch from an actual page, not the command line.'
      - 'checkBotId() needs Vercel''s edge infrastructure, so the handler fails open off-Vercel: BotID only enforces on real deployments.'
      - 'Honeypots alone do not stop sophisticated bots that skip hidden fields. Layer with rate limiting.'
    notes: 'https://vercel.com/docs/botid/get-started | https://vercel.com/docs/vercel-firewall/vercel-waf/rate-limiting | https://www.w3.org/TR/turingtest/'

