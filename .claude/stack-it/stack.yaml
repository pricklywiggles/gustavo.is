    notes: 'https://www.w3.org/TR/WCAG22/'

  - slot: error tracking
    choice: Sentry
    version: "@sentry/nextjs 10.70.0"
    install:
      - 'npm install @sentry/nextjs@10.64.0 --save-exact'
      - 'pnpm add @sentry/nextjs@10.70.0 --save-exact  # bumped from 10.64.0 while wiring it up'
      - 'Configured manually, no wizard: withSentryConfig in next.config.mjs (tunnelRoute "/sentry-tunnel", source-map upload only when SENTRY_AUTH_TOKEN is set, telemetry off), server/edge init in src/instrumentation.ts with onRequestError = captureRequestError, browser init in src/instrumentation-client.ts with onRouterTransitionStart, captureException in error.tsx and global-error.tsx'
      - 'Errors only: tracesSampleRate 0, no replay, enableLogs false, sendDefaultPii false; environment from VERCEL_ENV (server) / NEXT_PUBLIC_VERCEL_ENV (client) falling back to NODE_ENV; without NEXT_PUBLIC_SENTRY_DSN the SDK stays disabled'
    caveats:
      - 'Pinned 10.64.0 (2026-07-07, 9 days). 10.66.0 shipped today; Sentry releases roughly weekly, so a fresh version is normal cadence rather than a signal.'
      - 'Sentry declares a minimum of Next.js 13.2.0. Explicit Next 16 support was not confirmed from Sentry docs at decision time; confirmed in practice at 10.70.0, with withSentryConfig wrapping withBotId(withMDX(config)) through build and runtime.'
      - 'The real justification is narrow: a contact form that silently stops delivering is the one failure that would otherwise go unnoticed. Instrument the endpoints, not the whole site.'
      - 'Free tier ~5,000 errors/month — verify current numbers at sentry.io/pricing.'
      - 'Vercel Hobby does NOT include Log Drains (Pro/Enterprise only). Dashboard runtime logs exist but cannot be exported — which is part of why an external error tracker earns its place here.'
    notes: 'https://docs.sentry.io/platforms/javascript/guides/nextjs/'

  - slot: analytics + consent posture
    choice: Plausible Community Edition, self-hosted on the user's existing VPS, proxied through Vercel
    version: instance 3.2.1 | @plausible-analytics/tracker 0.4.6
    install:
      - 'The instance (Plausible CE v3.2.1: postgres, clickhouse and community-edition containers) is managed outside this repo at metrics.whpl.sh; the earlier in-repo compose recipe under infra/plausible/ was dropped 2026-08-26'
      - 'pnpm add @plausible-analytics/tracker@0.4.6 --save-exact'
      - 'vercel.json rewrite: /api/pa -> https://metrics.whpl.sh/api/event (a path without the words analytics, stats or plausible)'
      - 'src/lib/analytics.ts: init({ domain, endpoint: "/api/pa", outboundLinks: true, customProperties: () => ({ motion }) }) inside initAnalytics(), called from src/instrumentation-client.ts and inert unless NEXT_PUBLIC_VERCEL_ENV === "production"; custom events go through track(), a no-op until init ran'
      - 'Create a custom-event goal in the Plausible site settings for each name in EVENTS (Contact: Opened, Contact: Sent, Contact: Failed, Video: Played, 404); nothing is backfilled'
    caveats:
      - 'Self-hosting was the user''s explicit choice on an existing VPS with 2GB+ free. My earlier claim that it "costs more" assumed renting a new box and was wrong.'
      - 'Requires three containers: postgres:16-alpine, clickhouse/clickhouse-server:24.12-alpine, ghcr.io/plausible/community-edition:v3.2.1. Cannot run on Vercel. CPU must support SSE 4.2 (x86) or NEON (ARM) — a ClickHouse requirement.'
      - 'v3.2.1 fixes CVE-2026-8467 (unauthenticated RCE via an exposed /storybook endpoint from the phoenix_storybook dependency), which affected all of 3.0.0–3.2.0. 3.2.1 removes the endpoint entirely. Patches are NOT backported — staying current is mandatory, not optional.'
      - 'NO OFFICIAL BACKUP DOCUMENTATION EXISTS. Confirmed: the CE wiki has no backup page. Write your own: `docker compose exec plausible_db pg_dump -U postgres plausible_db > backup.sql` for Postgres, and ClickHouse''s BACKUP DATABASE command (which first requires registering a backups disk via a config.d override — not preconfigured in CE).'
      - 'The compose.yml already mounts ClickHouse low-resource overrides (mark_cache_size 500MB, max_threads 1). But there is NO docker memory limit — on a shared VPS, add deploy.resources.limits.memory in compose.override.yml so ClickHouse cannot starve your other services. Not documented by Plausible.'
      - 'DISABLE_REGISTRATION defaults to invite_only, not open — better than feared, but set it to true once your account exists.'
      - 'Postgres 5432 and ClickHouse 8123/9000 are NOT published externally in the default compose.yml (internal Docker network only). Do not add port mappings in an override.'
      - 'Upgrades are manual: git pull the new tag, docker compose up -d, prune old images.'
      - 'CE lacks vs Cloud: funnels, user journeys, ecommerce goals, SSO, Sites API, advanced bot filtering (CE has basic only), CSV/API export, Looker Studio connector.'
      - 'The Vercel rewrite satisfies Plausible''s X-Forwarded-For requirement automatically — a custom Edge Function proxy would not. Without the real visitor IP, Plausible''s bot filter drops events SILENTLY.'
      - 'Avoid the words analytics/stats/plausible in the rewrite path — ad blockers match on them.'
      - 'Script is 2.8KB, sets no cookies and uses no device storage. Operator is US-based, so no consent banner is required regardless.'
      - 'AGPLv3.'
      - 'Superseded 2026-08-26: the in-repo compose recipe (infra/plausible/) was dropped for an instance managed outside this repo at metrics.whpl.sh, and the legacy script.js tag gave way to the npm tracker (the script v2 API, CE 3.1.0+). Custom events, custom props, scroll depth and outbound links are all in CE; funnels are not.'
    notes: 'https://github.com/plausible/community-edition/wiki | https://plausible.io/docs/proxy/guides/vercel | https://clickhouse.com/docs/en/operations/backup'

